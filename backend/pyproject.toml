[project]
name = "scoutiq"
version = "0.1.0"
description = "ScoutIQ — Explainable NBA Contract Intelligence (data layer)"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "lxml>=5.0",
    "html5lib>=1.1",       # pandas read_html fallback parser for malformed BBRef pages
    "beautifulsoup4>=4.12",  # required alongside html5lib for the fallback flavor
    "requests>=2.31",
    "nba_api>=1.4.1",
    "scikit-learn>=1.4",   # gradient-boosted valuation model + metrics
    "matplotlib>=3.8",     # calibration / predicted-vs-actual plots
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scoutiq*"]
